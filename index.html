<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>簡易測量</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        #map { flex-grow: 1; width: 100%; z-index: 1; }
        #controls { padding: 10px; background: #f8f9fa; z-index: 1000; box-shadow: 0 -2px 5px rgba(0,0,0,0.1); }
        .btn { padding: 10px 15px; margin: 5px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; color: #fff; }
        .btn-blue { background-color: #007bff; }
        .btn-red { background-color: #dc3545; }
        .btn-gray { background-color: #6c757d; }
        .btn-teal { background-color: #17a2b8; }
        .input-group { margin: 5px; display: flex; align-items: center; }
        .input-group label { margin-right: 10px; font-weight: bold; font-size: 14px; }
        .input-group input { padding: 8px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; flex-grow: 1; }
        #status { font-size: 14px; margin-left: 5px; color: #d32f2f; font-weight: bold; }
        #areaDisplay { font-size: 18px; font-weight: bold; color: #28a745; margin: 5px; }
    </style>
</head>
<body>

<div id="map"></div>

<div id="controls">
    <div class="input-group">
        <label for="siteName">簡易測量v1.2 現場名:</label>
        <input type="text" id="siteName" placeholder="(空白可)">
    </div>
    <div id="areaDisplay">面積: 0.00 ha</div>
    <div>
        <button class="btn btn-teal" onclick="locateCurrentPosition()">🌐 現在地</button>
        <button class="btn btn-blue" onclick="acquireGPS()" id="gpsBtn">📍 測点取得 (GPS)</button>
        <button class="btn btn-red" onclick="resetPoints()">🗑️ リセット</button>
        <span id="status"></span>
    </div>
    <div>
        <button class="btn btn-gray" onclick="exportData('geojson')">出力 (GeoJSON)</button>
        <button class="btn btn-gray" onclick="exportData('kml')">出力 (KML)</button>
        <button class="btn btn-gray" onclick="clearCacheAndReload()" style="float: right; font-size: 12px; padding: 5px 10px;">↻ アプリ更新</button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([36.064, 136.219], 13);
    L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
        attribution: "<a href='https://maps.gsi.go.jp/development/ichiran.html' target='_blank'>地理院タイル</a>"
    }).addTo(map);

    let points = [];
    let markers = [];
    let drawLayer = null;
    let isAcquiring = false;

    window.addEventListener('load', () => {
        locateCurrentPosition();
    });

    function locateCurrentPosition() {
        const statusEl = document.getElementById('status');
        statusEl.textContent = "現在地を取得中...";
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                map.setView([pos.coords.latitude, pos.coords.longitude], 17);
                statusEl.textContent = "";
            },
            (err) => {
                statusEl.textContent = "現在地取得失敗";
                setTimeout(() => statusEl.textContent = "", 2000);
            },
            { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );
    }

    // GPS取得処理（iPhoneキャッシュ対策の強化版・10回取得）
    async function acquireGPS() {
        if (isAcquiring) return;
        isAcquiring = true;
        document.getElementById('gpsBtn').disabled = true;
        
        const statusEl = document.getElementById('status');
        statusEl.textContent = "GPS初期化中...";
        
        const readings = [];
        const maxReadings = 10; // 10回取得へ変更
        let watchId = null;
        const startTime = Date.now();
        let lastAcceptedTime = 0;

        const collectData = new Promise((resolve, reject) => {
            // タイムアウトを40秒に設定
            const timer = setTimeout(() => {
                if (readings.length > 0) resolve(readings);
                else reject(new Error("タイムアウト"));
            }, 40000);

            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    const now = Date.now();

                    // ① ウォームアップ: 最初の3秒間はiPhoneの古いキャッシュの可能性が高いため捨てる
                    if (now - startTime < 3000) {
                        statusEl.textContent = "キャッシュ破棄中...";
                        return;
                    }

                    // ② インターバル: 前回の採用から1秒以上経過していないデータは無視
                    if (now - lastAcceptedTime < 1000) return;

                    // ③ 精度確認: 誤差が50m以上の荒いデータはスキップ
                    if (pos.coords.accuracy > 50) {
                        statusEl.textContent = `精度待機 (${Math.round(pos.coords.accuracy)}m)...`;
                        return;
                    }

                    lastAcceptedTime = now;
                    readings.push(pos.coords);
                    statusEl.textContent = `取得中... (${readings.length}/${maxReadings})`;

                    if (readings.length >= maxReadings) {
                        clearTimeout(timer);
                        resolve(readings);
                    }
                },
                (err) => {},
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        });

        try {
            const results = await collectData;
            
            const avgLat = results.reduce((sum, r) => sum + r.latitude, 0) / results.length;
            const avgLng = results.reduce((sum, r) => sum + r.longitude, 0) / results.length;

            let sumSqLat = 0;
            let sumSqLng = 0;
            results.forEach(r => {
                sumSqLat += Math.pow((r.latitude - avgLat) * 111000, 2);
                sumSqLng += Math.pow((r.longitude - avgLng) * 89800, 2);
            });
            const stdDevTotal = Math.sqrt((sumSqLat / results.length) + (sumSqLng / results.length));

            statusEl.textContent = "判定中...";
            
            setTimeout(() => {
                const confirmMsg = `【測点 ${points.length + 1}】\n取得回数: ${results.length} 回\n標準偏差(ばらつき): 約 ${stdDevTotal.toFixed(1)} m\n\nこの測点を採用しますか？`;
                if (confirm(confirmMsg)) {
                    addPoint(avgLat, avgLng);
                    statusEl.textContent = "採用完了";
                } else {
                    statusEl.textContent = "破棄しました";
                }
                setTimeout(() => statusEl.textContent = "", 2000);
            }, 100);

        } catch (err) {
            alert('GPSデータの収集に失敗しました。空がひらけた場所で再試行してください。');
            statusEl.textContent = "";
        } finally {
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            isAcquiring = false;
            document.getElementById('gpsBtn').disabled = false;
        }
    }

    function addPoint(lat, lng) {
        points.push([lat, lng]);
        const pointNumber = points.length;
        
        const marker = L.marker([lat, lng]).addTo(map)
            .bindTooltip(`測点 ${pointNumber}`, { permanent: true, direction: 'right' }).openTooltip();
        markers.push(marker);

        map.setView([lat, lng], 17);
        updateDrawing();
    }

    // 球面面積の計算 (平方メートルを算出し、haへ換算)
    function calculateArea(latLngs) {
        if (latLngs.length < 3) return 0;
        let area = 0;
        const R = 6378137; // 地球の半径 (m)
        const d2r = Math.PI / 180;

        for (let i = 0; i < latLngs.length; i++) {
            const p1 = latLngs[i];
            const p2 = latLngs[(i + 1) % latLngs.length];
            area += (p2[1] - p1[1]) * d2r * (2 + Math.sin(p1[0] * d2r) + Math.sin(p2[0] * d2r));
        }
        area = Math.abs(area * R * R / 2.0);
        return area / 10000; // m2 から ha に変換
    }

    function updateDrawing() {
        if (drawLayer) {
            map.removeLayer(drawLayer);
            drawLayer = null;
        }

        const areaDisplay = document.getElementById('areaDisplay');

        if (points.length === 2) {
            drawLayer = L.polyline(points, { color: 'red', weight: 3 }).addTo(map);
            areaDisplay.textContent = "面積: 0.00 ha";
        } else if (points.length >= 3) {
            drawLayer = L.polygon(points, { color: 'red', weight: 3, fillColor: '#ff0000', fillOpacity: 0.2 }).addTo(map);
            // 面積計算と表示更新
            const ha = calculateArea(points);
            areaDisplay.textContent = `面積: ${ha.toFixed(2)} ha`;
        } else {
            areaDisplay.textContent = "面積: 0.00 ha";
        }
    }

    function resetPoints() {
        if (!confirm('全ての測点を削除しますか？')) return;
        points = [];
        markers.forEach(m => map.removeLayer(m));
        markers = [];
        if (drawLayer) { map.removeLayer(drawLayer); drawLayer = null; }
        document.getElementById('areaDisplay').textContent = "面積: 0.00 ha";
    }

    function generateFileName(extension) {
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const hh = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const siteName = document.getElementById('siteName').value.trim();
        const namePart = siteName ? `_${siteName}` : '';
        return `${yyyy}${mm}${dd}${hh}${min}${namePart}.${extension}`;
    }

    function exportData(format) {
        if (points.length < 3) {
            alert('区域を出力するには最低3つの測点が必要です。');
            return;
        }

        const lngLatPoints = points.map(p => [p[1], p[0]]);
        lngLatPoints.push(lngLatPoints[0]);

        let dataStr = "";
        let mimeType = "";

        if (format === 'geojson') {
            const geojson = {
                "type": "FeatureCollection",
                "features": [{
                    "type": "Feature",
                    "properties": { 
                        "name": document.getElementById('siteName').value,
                        "area_ha": parseFloat(calculateArea(points).toFixed(2))
                    },
                    "geometry": {
                        "type": "Polygon",
                        "coordinates": [lngLatPoints]
                    }
                }]
            };
            dataStr = JSON.stringify(geojson, null, 2);
            mimeType = "application/geo+json";
        } else if (format === 'kml') {
            const coordsStr = lngLatPoints.map(p => `${p[0]},${p[1]},0`).join(' ');
            const siteName = document.getElementById('siteName').value || '簡易測量区域';
            const areaHa = calculateArea(points).toFixed(2);
            
            dataStr = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>${siteName}</name>
    <Style id="surveyAreaStyle">
      <LineStyle><color>ff0000ff</color><width>3</width></LineStyle>
      <PolyStyle><color>330000ff</color></PolyStyle>
    </Style>
    <Placemark>
      <name>${siteName} (${areaHa} ha)</name>
      <description>面積: ${areaHa} ha</description>
      <styleUrl>#surveyAreaStyle</styleUrl>
      <Polygon>
        <tessellate>1</tessellate>
        <outerBoundaryIs><LinearRing><coordinates>${coordsStr}</coordinates></LinearRing></outerBoundaryIs>
      </Polygon>
    </Placemark>
  </Document>
</kml>`;
            mimeType = "application/vnd.google-earth.kml+xml";
        }

        const blob = new Blob([dataStr], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = generateFileName(format);
        a.click();
        URL.revokeObjectURL(url);
    }

    function clearCacheAndReload() {
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) registration.unregister();
            });
            caches.keys().then(function(names) {
                for (let name of names) caches.delete(name);
            }).then(() => {
                alert('キャッシュをクリアしました。最新版を読み込みます。');
                window.location.reload(true);
            });
        } else {
            window.location.reload(true);
        }
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js');
        });
    }
</script>
</body>
</html>
